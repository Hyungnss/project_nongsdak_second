# grafana 가 처음 뜰 때 prometheus 를 데이터 원본으로 자동 등록한다.
# uid 는 대시보드(dashboards/nongsdak.json)가 이 값으로 찾으므로 바꾸지 않는다.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 30s      # prometheus 의 scrape_interval 과 같게
