# ─────────────────────────────────────────────────────────────────────────────
# 서버 배포 — AWS Lightsail 의 self-hosted runner 가 직접 돌린다.
#
#   v* 태그  ──▶ ci.yml (검사 → GHCR 이미지 · Release) ──▶ 이 파일 (서버 배포)
#   손으로   ──▶ Actions > deploy > Run workflow > 버전 입력 (예: 2.0.0)
#                이미 GHCR 에 있는 버전을 다시 올리거나, 이전 버전으로 되돌릴 때 쓴다.
#
# runner 는 서버 안에서 돌기 때문에 SSH 가 필요 없다. 서버가 GitHub 에 일감을 받으러 간다.
#
# 서버 폴더 /srv/nongsdak
#   docker-compose.yml · docker-compose.prod.yml · Caddyfile · database/(schema · migrations · migrate.sh)  ← 저장소에서 복사
#   monitoring/ (prometheus 설정 · grafana 프로비저닝 · 대시보드)                                     ← 저장소에서 복사
#   .env                                                                         ← 아래에서 Secrets 로 매번 새로 쓴다
#
# 필요한 Secrets   : DB_PASSWORD · KAMIS_CERT_KEY · KAMIS_CERT_ID · DATA_GO_KR_KEY(기상청) · ECOS_KEY(한국은행) · GRAFANA_ADMIN_PASSWORD
#   GRAFANA_ADMIN_PASSWORD 는 https://<도메인>/grafana/ 의 admin 비밀번호 (docs/MONITORING.md).
#   grafana 를 '처음' 띄울 때만 들어간다 — 나중에 Secret 만 바꾸면 반영되지 않는다.
# 필요한 Variables : SITE_DOMAIN (예: nongsdak.example.com — 이 서버 IP 를 가리키는 도메인)
#   DB_PASSWORD 는 DB 를 '처음' 만들 때만 계정에 들어간다. 나중에 Secret 만 바꾸면
#   앱과 DB 의 비밀번호가 어긋나 접속이 끊긴다 — 바꿀 때는 DB 안에서도 ALTER USER 로 같이 바꾼다.
# ─────────────────────────────────────────────────────────────────────────────
name: deploy

on:
  workflow_call:
    inputs:
      version:
        description: "배포할 이미지 버전 (예: 2.1.0)"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: "배포할 이미지 버전 (예: 2.1.0) — GHCR 에 이미 있는 것"
        required: true
        type: string

# 배포는 한 번에 하나만. 도중에 끊으면 서버가 어중간한 상태가 되므로 취소하지 않고 줄을 세운다.
concurrency:
  group: deploy-lightsail
  cancel-in-progress: false

permissions:
  contents: read
  packages: read      # GHCR 에서 비공개 이미지를 받으려면 필요하다

jobs:
  deploy:
    name: 서버 배포
    runs-on: [self-hosted, lightsail]
    timeout-minutes: 15
    environment:
      name: production
      url: https://${{ vars.SITE_DOMAIN }}
    env:
      APP_DIR: /srv/nongsdak
      VERSION: ${{ inputs.version }}
      SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
    steps:
      - name: 버전 형식 확인
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::버전은 2.1.0 처럼 숫자.숫자.숫자 로 적습니다 (받은 값: '$VERSION')"
            exit 1
          fi
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nongsdak:${VERSION}" >> "$GITHUB_ENV"

      # 서버에 필요한 파일만 받는다 (코드 전체는 이미지 안에 있다).
      - name: 배포 파일 받기
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            docker-compose.yml
            docker-compose.prod.yml
            Caddyfile
            database/schema.sql
            database/migrate.sh
            database/migrations/
            monitoring/
          sparse-checkout-cone-mode: false

      - name: 배포 파일 복사
        run: |
          mkdir -p "$APP_DIR/database"
          cp docker-compose.yml docker-compose.prod.yml Caddyfile "$APP_DIR/"
          # migrations 는 통째로 바꿔 넣는다 (저장소에서 지운 파일이 서버에 남지 않게)
          rm -rf "$APP_DIR/database/migrations"
          cp -r database/schema.sql database/migrate.sh database/migrations "$APP_DIR/database/"
          # monitoring 도 통째로 바꿔 넣는다. 데이터는 볼륨(prometheus_data · grafana_data)에 있어 지워지지 않는다.
          rm -rf "$APP_DIR/monitoring"
          cp -r monitoring "$APP_DIR/"

      # .env 를 Secrets 로 새로 쓴다. 서버에서 손으로 고치지 않는다 — 원본은 GitHub 에 있다.
      # 값은 환경변수로 넘겨 스크립트 본문에 비밀이 박히지 않게 한다 (로그에는 *** 로 가려진다).
      - name: .env 쓰기
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          KAMIS_CERT_KEY: ${{ secrets.KAMIS_CERT_KEY }}
          KAMIS_CERT_ID: ${{ secrets.KAMIS_CERT_ID }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          ECOS_KEY: ${{ secrets.ECOS_KEY }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
        run: |
          for k in DB_PASSWORD KAMIS_CERT_KEY KAMIS_CERT_ID DATA_GO_KR_KEY ECOS_KEY GRAFANA_ADMIN_PASSWORD SITE_DOMAIN; do
            [ -n "${!k}" ] || { echo "::error::$k 가 비어 있습니다 (Settings > Secrets and variables)"; exit 1; }
          done
          umask 077
          {
            echo "# 배포 작업(deploy.yml)이 GitHub Secrets 로 매번 새로 쓴다. 손으로 고치지 않는다."
            echo "COMPOSE_FILE=docker-compose.yml:docker-compose.prod.yml"
            echo "IMAGE=$IMAGE"
            echo "SITE_DOMAIN=$SITE_DOMAIN"
            echo "DB_NAME=nongsdak"
            echo "DB_USER=nongsdak"
            echo "DB_PASSWORD=$DB_PASSWORD"
            echo "KAMIS_CERT_KEY=$KAMIS_CERT_KEY"
            echo "KAMIS_CERT_ID=$KAMIS_CERT_ID"
            echo "DATA_GO_KR_KEY=$DATA_GO_KR_KEY"
            echo "ECOS_KEY=$ECOS_KEY"
            echo "GRAFANA_ADMIN_PASSWORD=$GRAFANA_ADMIN_PASSWORD"
          } > "$APP_DIR/.env.new"
          mv "$APP_DIR/.env.new" "$APP_DIR/.env"

      # 이 작업의 GITHUB_TOKEN 으로 로그인해 받고, 끝나면 바로 로그아웃한다.
      # 서버에 오래 가는 토큰을 남기지 않는다.
      - name: 이미지 받기
        working-directory: ${{ env.APP_DIR }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          trap 'docker logout ghcr.io >/dev/null' EXIT
          docker compose pull --quiet

      # 새 코드가 뜨기 전에 DB 를 맞춘다. 마이그레이션이 실패하면 여기서 멈추고 옛 버전이 계속 돈다.
      # (마이그레이션은 '더하기' 만 하므로 옛 코드도 새 DB 에서 그대로 돈다)
      - name: DB 마이그레이션
        working-directory: ${{ env.APP_DIR }}
        run: |
          docker compose up -d --wait --wait-timeout 120 db
          bash database/migrate.sh

      # --wait : healthcheck 가 있는 서비스는 healthy 가 될 때까지 기다린다 (web 은 /api/health 로 DB 까지 본다)
      - name: 띄우기
        working-directory: ${{ env.APP_DIR }}
        run: |
          docker compose up -d --wait --wait-timeout 180 --remove-orphans
          # Caddyfile 은 파일로 붙여 둔 것이라 바뀌어도 compose 가 caddy 를 다시 띄우지 않는다 → 설정만 다시 읽힌다 (끊김 없음).
          # (v2.5.0 배포 때 /metrics 막기가 이것 때문에 안 먹었다)
          docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile

      # 바깥 문(caddy)을 거쳐 https 로도 되는지 본다. 인증서까지 검사한다 (-k 를 쓰지 않는다).
      # --resolve 로 도메인을 이 서버(127.0.0.1)로 바로 보낸다. 첫 배포에는 인증서 발급에 몇 초 걸린다.
      - name: 확인
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -e
          url="https://$SITE_DOMAIN/api/health"
          for _ in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --resolve "$SITE_DOMAIN:443:127.0.0.1" "$url" || true)
            [ "$code" = "200" ] && break
            sleep 3
          done
          echo "$url : $code"
          [ "$code" = "200" ] || { echo "::error::$url 가 $code 를 돌려줬습니다"; exit 1; }
          # 새 버전이 실제로 떴는지 (이미지에 박힌 버전). 2.1.0 이하 이미지는 버전을 내보내지 않으므로
          # (되돌리기 배포) 그때는 경고만 한다.
          got=$(curl -s --resolve "$SITE_DOMAIN:443:127.0.0.1" "$url" | python3 -c "import json,sys; print(json.load(sys.stdin).get('version',''))")
          echo "버전: ${got:-(없음)}"
          if [ -z "$got" ] || [ "$got" = "dev" ]; then
            echo "::warning::이 이미지는 버전을 알려 주지 않습니다 (2.1.0 이하) — 버전 확인을 건너뜁니다"
          elif [ "$got" != "$VERSION" ]; then
            echo "::error::떠 있는 버전($got)이 배포한 버전($VERSION)과 다릅니다"; exit 1
          fi
          # http 로 오면 https 로 보내는지
          redir=$(curl -s -o /dev/null -w "%{http_code} %{redirect_url}" --resolve "$SITE_DOMAIN:80:127.0.0.1" "http://$SITE_DOMAIN/")
          echo "http → $redir"
          case "$redir" in 30[178]\ https://*) ;; *) echo "::error::http 가 https 로 넘어가지 않습니다 ($redir)"; exit 1 ;; esac
          # 운영 지표는 바깥에서 보이면 안 된다 (caddy 가 404). grafana 는 /grafana/ 아래에서 떠야 한다.
          # grafana 는 처음 뜰 때 내부 DB 를 만드느라 1~2분 걸린다 (그래서 3분까지 기다린다).
          for p in /metrics /grafana/metrics; do
            m=$(curl -s -o /dev/null -w "%{http_code}" --resolve "$SITE_DOMAIN:443:127.0.0.1" "https://$SITE_DOMAIN$p")
            echo "$p (바깥) : $m"
            [ "$m" = "404" ] || { echo "::error::$p 가 바깥에 열려 있습니다 ($m) — Caddyfile 확인"; exit 1; }
          done
          g=""
          for _ in $(seq 1 60); do
            g=$(curl -s -o /dev/null -w "%{http_code}" --resolve "$SITE_DOMAIN:443:127.0.0.1" "https://$SITE_DOMAIN/grafana/api/health" || true)
            [ "$g" = "200" ] && break
            sleep 3
          done
          echo "/grafana : $g"
          [ "$g" = "200" ] || { echo "::error::grafana 가 응답하지 않습니다 ($g)"; exit 1; }
          docker compose ps
          echo "### 배포 완료 · $IMAGE · https://$SITE_DOMAIN" >> "$GITHUB_STEP_SUMMARY"

      - name: 실패하면 로그 보기
        if: failure()
        working-directory: ${{ env.APP_DIR }}
        run: docker compose logs --no-color --tail 100 || true

      # 쓰지 않는 이미지(이름 없는 것)만 지운다. 버전 태그가 붙은 이전 이미지는 되돌리기용으로 남는다.
      - name: 정리
        if: always()
        run: docker image prune -f >/dev/null
