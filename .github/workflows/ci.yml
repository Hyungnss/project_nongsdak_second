# ─────────────────────────────────────────────────────────────────────────────
# 농스닥 CI/CD
#
#   main 에 push · PR      ──▶  test + compose                       (검사만)
#   v* 태그 push (v2.0.0)   ──▶  test + compose ──▶ release ──▶ deploy  (둘 다 통과해야만 배포)
#
# test    : 린트(ruff) + 시험(pytest). KAMIS 인증키는 필요 없다.
#           PostgreSQL 을 서비스 컨테이너로 띄워 SQL 까지 실제 DB 로 검증한다 (tests/test_pg_*.py).
#           시험은 'nongsdak_test' DB 를 새로 만들어 쓰고 database/schema.sql 도 그때 적용된다.
# compose : Dockerfile 로 이미지를 만들고 docker compose 로 db + web 을 실제로 띄워
#           헬스체크 · 화면 · API 를 불러 본다. 서버에서 도는 모양 그대로 검증한다.
# release : 이미지를 GHCR(ghcr.io/<계정>/nongsdak:<버전> · latest)에 올리고 GitHub Release 를 만든다.
# deploy  : deploy.yml 을 불러 AWS Lightsail 서버의 self-hosted runner 가 그 이미지로 바꿔 띄운다.
# ─────────────────────────────────────────────────────────────────────────────
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:          # PR 을 열거나 새 커밋을 올리면 머지 전에 검사
  workflow_dispatch:     # Actions 탭에서 손으로 다시 돌릴 수 있게

# 같은 브랜치 · 태그에서 새 실행이 시작되면 아직 도는 옛 실행은 취소한다 (시간 · 분량 절약).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 기본은 읽기만. 쓰기가 필요한 deploy 작업에서만 따로 연다.
permissions:
  contents: read

jobs:
  # ── 1. 검사 ────────────────────────────────────────────────────────────────
  test:
    name: 린트 · 시험
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    # 시험용 PostgreSQL. 버전은 docker-compose.yml 과 같게 맞춘다.
    # 이 DB 는 작업이 끝나면 사라진다 — 비밀번호도 시험 전용 값이라 Secrets 에 둘 필요가 없다.
    services:
      postgres:
        image: postgres:18.7
        env:
          POSTGRES_USER: nongsdak
          POSTGRES_PASSWORD: nongsdak
          POSTGRES_DB: nongsdak
        ports:
          - 5432:5432
        # 접속을 받을 준비가 될 때까지 기다린 뒤 다음 단계로 간다
        options: >-
          --health-cmd "pg_isready -U nongsdak -d nongsdak"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      PYTHONUTF8: "1"    # 한글 주석 · 출력이 많아 UTF-8 모드로 고정한다
      # config.py 가 읽는 접속 정보 (.env 대신 환경변수로 준다)
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_NAME: nongsdak
      DB_USER: nongsdak
      DB_PASSWORD: nongsdak
    steps:
      - name: 코드 받기
        uses: actions/checkout@v7

      # uv 를 설치한다. 내려받은 패키지는 캐시해 다음 실행을 빠르게 한다.
      # setup-uv 는 v10 같은 큰 버전 태그를 내지 않는다 — 정확한 버전을 적어야 한다.
      - name: uv 설치
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      # .python-version(3.11) 의 파이썬을 받고, uv.lock 에 적힌 버전 그대로 설치한다.
      # --locked : pyproject.toml 을 고치고 uv.lock 을 안 갱신했으면 여기서 실패한다
      #            (로컬과 CI 가 다른 버전으로 도는 일을 막는다).
      - name: 의존성 설치
        run: uv sync --locked

      # 코드를 돌리지 않고 읽어서 실수를 찾는다 (정의 안 된 이름, 안 쓰는 import, 문법 오류).
      # 어떤 규칙을 볼지는 pyproject.toml 의 [tool.ruff.lint] 에 있다.
      - name: 린트 (ruff)
        run: uv run ruff check --output-format=github .

      # tests/ 의 시험 전부. DB 시험은 위 postgres 서비스를 쓴다 (CI=true 라 접속 실패면 건너뛰지 않고 실패).
      # 화면 스크립트 문법 검사에 node 를 쓰는데,
      # GitHub 의 ubuntu 러너에는 node 가 이미 깔려 있다.
      - name: 시험 (pytest)
        run: uv run pytest -v

  # ── 2. 컨테이너 검증 ───────────────────────────────────────────────────────
  compose:
    name: 이미지 · compose
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      IMAGE: nongsdak:ci            # docker-compose.yml 의 web · collector 가 이 이미지를 쓴다
    steps:
      - name: 코드 받기
        uses: actions/checkout@v7

      - name: Docker Buildx 준비
        uses: docker/setup-buildx-action@v4

      # 이미지를 만들어 러너의 docker 에 올린다(load). 층(layer)은 GitHub 캐시에 남겨
      # 다음 빌드에서 의존성 층을 다시 만들지 않게 한다.
      - name: 이미지 빌드
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # .env 없이 기본값으로 뜬다 (DB 비밀번호도 시험 전용 기본값). --wait 는 healthcheck 가
      # healthy 가 될 때까지 기다린다 — web 의 healthcheck 는 /api/health 로 DB 까지 본다.
      - name: db + web 띄우기
        run: docker compose up -d --no-build --wait --wait-timeout 120 db web

      - name: 화면 · API 불러 보기
        run: |
          set -e
          for path in /api/health / /api/meta /api/products /api/briefing "/api/meta?market=wholesale" /static/auth.js; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:8080$path")
            echo "$code  $path"
            [ "$code" = "200" ] || { echo "::error::$path 가 $code 를 돌려줬습니다"; exit 1; }
          done
          # 로그인 없이 장바구니는 401 이어야 한다
          [ "$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/api/cart)" = "401" ]

      # 수집기는 같은 이미지에서 명령만 다르다. 모듈이 다 불러와지는지만 본다 (KAMIS 는 부르지 않는다).
      - name: 수집기 컨테이너 확인
        run: docker compose run --rm --no-deps collector python -c "import collector.scheduler, collector.upsert, collector.check; print('collector ok')"

      - name: 실패하면 로그 보기
        if: failure()
        run: docker compose logs --no-color

      - name: 정리
        if: always()
        run: docker compose down -v

  # ── 3. 이미지 · Release (v* 태그일 때만) ──────────────────────────────────
  release:
    name: 이미지 · Release
    needs: [test, compose]                          # 두 검사를 모두 통과해야만 실행된다
    if: startsWith(github.ref, 'refs/tags/v')       # main push · PR 에서는 건너뛴다
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.name.outputs.version }}    # 서버 배포(deploy)에 넘긴다
    permissions:
      contents: write                               # Release 를 만들려면 쓰기 권한이 필요하다
      packages: write                               # GHCR 에 이미지를 올리려면 필요하다
    steps:
      - name: 코드 받기
        uses: actions/checkout@v7

      # 태그(v1.0.0)와 pyproject.toml 의 version(1.0.0)이 다르면 멈춘다.
      # 버전을 올리는 걸 잊고 태그만 달았을 때를 잡는다.
      - name: 태그와 버전이 같은지 확인
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "태그 ${GITHUB_REF_NAME} · pyproject 버전 ${ver}"
          if [ "$tag" != "$ver" ]; then
            echo "::error::태그(${GITHUB_REF_NAME})와 pyproject.toml 의 version(${ver})이 다릅니다. 버전을 맞춘 뒤 다시 태그를 다세요."
            exit 1
          fi

      # 이미지 이름은 소문자여야 한다 (계정 이름에 대문자가 있어도). ghcr.io/<계정>/nongsdak
      - name: 이미지 이름 정하기
        id: name
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nongsdak" >> "$GITHUB_ENV"
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Docker Buildx 준비
        uses: docker/setup-buildx-action@v4

      # GHCR 로그인. 따로 만든 토큰 없이 이 작업의 GITHUB_TOKEN 으로 된다.
      - name: GHCR 로그인
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # compose 작업과 같은 캐시를 쓰므로 대부분 층을 다시 만들지 않는다.
      # 태그는 버전(2.0.0)과 latest 두 개. 서버는 버전 태그로 받는다 (latest 는 사람이 볼 때용).
      - name: 이미지 빌드 · GHCR 에 올리기
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha

      # GitHub Release 를 만든다. 변경 내역은 지난 태그 이후의 커밋 · PR 로 자동 작성된다.
      # gh 는 GitHub 러너에 기본으로 깔려 있다.
      - name: GitHub Release 만들기
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag

  # ── 4. 서버 배포 (v* 태그일 때만) ──────────────────────────────────────────
  # 서버 안의 runner 가 돈다. 자세한 건 deploy.yml. 손으로 되돌릴 때도 그 파일을 쓴다.
  deploy:
    name: 서버 배포
    needs: [release]
    uses: ./.github/workflows/deploy.yml
    with:
      version: ${{ needs.release.outputs.version }}
    secrets: inherit
    permissions:
      contents: read
      packages: read
