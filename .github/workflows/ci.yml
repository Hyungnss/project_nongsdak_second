# ─────────────────────────────────────────────────────────────────────────────
# 농스닥 CI/CD
#
#   main 에 push · PR      ──▶  test            (검사만)
#   v* 태그 push (v1.0.0)   ──▶  test ──▶ deploy  (검사를 통과해야만 배포)
#
# test   : 린트(ruff) + 시험(pytest). Oracle 도 KAMIS 인증키도 필요 없다.
#          DB 를 부르는 함수는 시험 안에서 가짜로 바꿔 끼운다 (tests/test_api.py).
# deploy : 지금은 GitHub Release 를 만드는 데까지만 한다.
#          실제 서버 배포는 배포 대상(클라우드 VM · Docker 등)이 정해지면
#          아래 '실제 배포' 자리에 단계를 더한다.
# ─────────────────────────────────────────────────────────────────────────────
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:          # PR 을 열거나 새 커밋을 올리면 머지 전에 검사
  workflow_dispatch:     # Actions 탭에서 손으로 다시 돌릴 수 있게

# 같은 브랜치 · 태그에서 새 실행이 시작되면 아직 도는 옛 실행은 취소한다 (시간 · 분량 절약).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 기본은 읽기만. 쓰기가 필요한 deploy 작업에서만 따로 연다.
permissions:
  contents: read

jobs:
  # ── 1. 검사 ────────────────────────────────────────────────────────────────
  test:
    name: 린트 · 시험
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"    # 한글 주석 · 출력이 많아 UTF-8 모드로 고정한다
    steps:
      - name: 코드 받기
        uses: actions/checkout@v7

      # uv 를 설치한다. 내려받은 패키지는 캐시해 다음 실행을 빠르게 한다.
      # setup-uv 는 v10 같은 큰 버전 태그를 내지 않는다 — 정확한 버전을 적어야 한다.
      - name: uv 설치
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      # .python-version(3.11) 의 파이썬을 받고, uv.lock 에 적힌 버전 그대로 설치한다.
      # --locked : pyproject.toml 을 고치고 uv.lock 을 안 갱신했으면 여기서 실패한다
      #            (로컬과 CI 가 다른 버전으로 도는 일을 막는다).
      - name: 의존성 설치
        run: uv sync --locked

      # 코드를 돌리지 않고 읽어서 실수를 찾는다 (정의 안 된 이름, 안 쓰는 import, 문법 오류).
      # 어떤 규칙을 볼지는 pyproject.toml 의 [tool.ruff.lint] 에 있다.
      - name: 린트 (ruff)
        run: uv run ruff check --output-format=github .

      # tests/ 의 시험 전부. 화면 스크립트 문법 검사에 node 를 쓰는데,
      # GitHub 의 ubuntu 러너에는 node 가 이미 깔려 있다.
      - name: 시험 (pytest)
        run: uv run pytest -v

  # ── 2. 배포 (v* 태그일 때만) ───────────────────────────────────────────────
  deploy:
    name: 배포
    needs: test                                     # 검사를 통과해야만 실행된다
    if: startsWith(github.ref, 'refs/tags/v')       # main push · PR 에서는 건너뛴다
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write                               # Release 를 만들려면 쓰기 권한이 필요하다
    steps:
      - name: 코드 받기
        uses: actions/checkout@v7

      # 태그(v1.0.0)와 pyproject.toml 의 version(1.0.0)이 다르면 멈춘다.
      # 버전을 올리는 걸 잊고 태그만 달았을 때를 잡는다.
      - name: 태그와 버전이 같은지 확인
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "태그 ${GITHUB_REF_NAME} · pyproject 버전 ${ver}"
          if [ "$tag" != "$ver" ]; then
            echo "::error::태그(${GITHUB_REF_NAME})와 pyproject.toml 의 version(${ver})이 다릅니다. 버전을 맞춘 뒤 다시 태그를 다세요."
            exit 1
          fi

      # GitHub Release 를 만든다. 변경 내역은 지난 태그 이후의 커밋 · PR 로 자동 작성된다.
      # gh 는 GitHub 러너에 기본으로 깔려 있다.
      - name: GitHub Release 만들기
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag

      # ── 실제 배포 ──────────────────────────────────────────────────────────
      # 배포 대상이 정해지면 여기에 단계를 더한다. 예) 클라우드 VM 이라면
      #   - SSH 로 접속 → git fetch --tags && git checkout $GITHUB_REF_NAME
      #   - uv sync --locked --no-dev → 서비스 재시작
      # 접속 정보(호스트 · 키)는 저장소 Settings > Secrets 에 넣고 ${{ secrets.이름 }} 으로 쓴다.
