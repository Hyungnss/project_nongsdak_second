[project]
name = "nongsdak"
version = "1.0.0"
description = "농스닥 — KAMIS 일별 소매·도매 시세를 평년 대비로 보여주는 웹서비스"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.143.1",
    "oracledb>=26.0.1",
    "pandas>=3.0.6",
    "requests>=2.34.2",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
