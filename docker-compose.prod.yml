# ─────────────────────────────────────────────────────────────────────────────
# 서버(AWS Lightsail)용 덧씌움 파일 — docker-compose.yml 위에 겹쳐서 쓴다.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# 서버에서는 배포 작업(.github/workflows/deploy.yml)이 /srv/nongsdak 에서 이 명령을 돌린다.
# 손으로 만질 때도 같은 폴더에서 같은 두 파일을 준다. 매번 -f 두 개가 귀찮으면
# .env 에 COMPOSE_FILE=docker-compose.yml:docker-compose.prod.yml (배포 작업이 넣어 둔다).
#
# 로컬과 다른 점
#   · 이미지는 빌드하지 않고 GHCR 에서 받는다 (IMAGE=ghcr.io/<계정>/nongsdak:<버전>)
#   · 바깥에서 들어오는 문은 caddy(80 · 443) 하나. web · db 는 포트를 열지 않는다
#     caddy 가 SITE_DOMAIN 의 HTTPS 인증서를 받고, http 로 오면 https 로 보낸다
#   · collector 를 항상 띄운다 (서버에는 작업 스케줄러가 없다)
#   · 운영 모니터링 prometheus · grafana · node-exporter 를 같이 띄운다 (docs/MONITORING.md)
#
# `!reset` 은 원본 파일의 값을 지운다 (docker compose 2.24 이상).
# ─────────────────────────────────────────────────────────────────────────────

services:
  db:
    # 서버에서는 DB 를 바깥에 열지 않는다. 들여다볼 때는
    #   docker compose exec db psql -U nongsdak -d nongsdak
    ports: !reset []

  web:
    build: !reset null
    # caddy 가 같은 네트워크 안에서 web:8000 으로 넘겨 주므로 포트를 열 필요가 없다.
    ports: !reset []
    environment:
      # uvicorn --proxy-headers 가 caddy 의 X-Forwarded-* 를 믿게 한다.
      # web 은 바깥에 열려 있지 않아 caddy 만 말을 걸 수 있으므로 '*' 여도 안전하다.
      # (HTTPS 를 붙이면 로그인 쿠키의 Secure 가 이 값 덕분에 켜진다 — backend/auth.py)
      FORWARDED_ALLOW_IPS: "*"

  collector:
    build: !reset null
    profiles: !reset []

  caddy:
    # 정확한 버전으로 고정한다.
    image: caddy:2.11.9
    restart: unless-stopped
    ports:
      - "80:80"          # 인증서 발급 확인 · https 로 보내기
      - "443:443"        # HTTPS
      - "443:443/udp"    # HTTP/3
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?SITE_DOMAIN 이 .env 에 없습니다}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data          # 인증서 — 지우면 다시 받는다 (발급 횟수 제한이 있으니 지우지 않는다)
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy

  # ── 운영 모니터링 (docs/MONITORING.md) ────────────────────────────────────
  # prometheus 가 web:8000/metrics 와 node-exporter 를 30초마다 긁어 모으고, grafana 가 그린다.
  # 셋 다 포트를 열지 않는다. 바깥에서는 caddy 의 https://<도메인>/grafana/ 로만 들어온다.
  # 서버가 작으므로(메모리 1.9GB) 각각 mem_limit 을 둔다 — 넘으면 그 컨테이너만 죽고 다시 뜬다.

  prometheus:
    image: prom/prometheus:v3.16.0
    restart: unless-stopped
    # 보존 기간 15일, 용량은 많아야 1GB (둘 중 먼저 닿는 쪽에서 오래된 것부터 지운다).
    # v3 는 컨테이너 메모리 한도를 읽어 GC 를 맞춘다 (auto GOMEMLIMIT).
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=1GB
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    mem_limit: 256m

  grafana:
    image: grafana/grafana:13.3.1
    restart: unless-stopped
    environment:
      # https://<도메인>/grafana/ 아래에서 뜬다. caddy 는 앞부분(/grafana)을 떼지 않고 그대로 넘긴다.
      GF_SERVER_DOMAIN: ${SITE_DOMAIN:?SITE_DOMAIN 이 .env 에 없습니다}
      GF_SERVER_ROOT_URL: https://${SITE_DOMAIN}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      # 운영자 전용 — 익명 접근 · 가입 끔. 관리자 비밀번호는 .env (GitHub Secret GRAFANA_ADMIN_PASSWORD).
      # ⚠ 이 값은 grafana 가 '처음' 뜰 때(grafana_data 볼륨이 비어 있을 때)만 들어간다.
      #   나중에 바꾸는 법은 docs/MONITORING.md.
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD 가 .env 에 없습니다}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      # 바깥에 알리지 않고, 뜰 때 플러그인을 내려받지 않는다 (메모리 · 기동 시간 절약)
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/nongsdak.json
      GF_LOG_LEVEL: warn
      # Go 의 GC 가 mem_limit 보다 조금 앞에서 메모리를 돌려주게
      GOMEMLIMIT: 200MiB
    volumes:
      - grafana_data:/var/lib/grafana       # 로그인 정보 · 설정 (대시보드 원본은 저장소에 있다)
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    mem_limit: 256m

  # 서버 자체(CPU · 메모리 · 디스크)를 내보낸다. 호스트의 / 를 읽기 전용으로 들여다본다.
  node-exporter:
    image: prom/node-exporter:v1.13.1
    restart: unless-stopped
    command:
      - --path.rootfs=/host
    pid: host
    volumes:
      - /:/host:ro,rslave
    mem_limit: 64m

volumes:
  caddy_data:
  caddy_config:
  prometheus_data:
  grafana_data:
